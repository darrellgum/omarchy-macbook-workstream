[package]
name = "t1-dash"
version = "0.1.0"
edition = "2021"
description = "Custom T1Bridge Touch Bar renderer: Hyprland workspaces, Grok Bot marks, system pulse, clock"
license = "CC0-1.0 AND MIT"

[dependencies]
libc = "0.2"
tiny-skia = "0.11"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[features]
default = ["grok-bot"]
# Grok Bot desktop integration: avatar marks, roster/unread/working state, tap-to-focus.
# Active only when the app is installed: mark geometry is extracted from it at runtime.
# Build with --no-default-features to leave it out entirely.
grok-bot = []

[profile.release]
opt-level = 3
lto = "thin"
strip = true
